<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="favDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#242B3B"/>
      <stop offset="100%" stop-color="#121620"/>
    </linearGradient>
    <linearGradient id="favOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A38"/>
      <stop offset="100%" stop-color="#FF4800"/>
    </linearGradient>
  </defs>

  <!-- 外层深色基底 -->
  <rect width="32" height="32" rx="7.5" fill="url(#favDark)" stroke="#475569" stroke-width="1.2"/>

  <!-- 居中 DAC 胶囊徽章 -->
  <rect x="4.5" y="9" width="23" height="14" rx="4.5" fill="url(#favOrange)"/>

  <!-- DAC 文字 -->
  <text x="16" y="16.2" dominant-baseline="central" fill="#FFFFFF" font-size="7.5" font-weight="900" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" text-anchor="middle" letter-spacing="0.5">DAC</text>

  <!-- 右上角 AI 星标 -->
  <path d="M 26 5 C 26 7.5 24.5 9 22 9 C 24.5 9 26 10.5 26 13 C 26 10.5 27.5 9 30 9 C 27.5 9 26 7.5 26 5 Z" fill="#FFE873"/>
</svg>
