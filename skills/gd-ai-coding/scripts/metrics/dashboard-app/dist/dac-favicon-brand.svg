<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="cleanDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#242B3B"/>
      <stop offset="100%" stop-color="#121620"/>
    </linearGradient>
    <linearGradient id="cleanOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A38"/>
      <stop offset="100%" stop-color="#FF4800"/>
    </linearGradient>
    <linearGradient id="topHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="brandPlateRound">
      <rect x="8" y="8" width="112" height="112" rx="28"/>
    </clipPath>
  </defs>

  <!-- 1. 外层深色底板 -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#cleanDark)" stroke="#475569" stroke-width="3.5"/>
  <rect x="8" y="8" width="112" height="56" fill="url(#topHighlight)" clip-path="url(#brandPlateRound)"/>

  <!-- 2. 居中 DAC 橙色胶囊徽标 -->
  <rect x="18" y="36" width="92" height="56" rx="18" fill="url(#cleanOrange)"/>

  <!-- 3. DAC 矢量文字（居中加粗） -->
  <text x="64" y="65" dominant-baseline="central" fill="#FFFFFF" font-size="28" font-weight="900" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" text-anchor="middle" letter-spacing="2">DAC</text>

  <!-- 4. 右上角 AI 算力星芒 -->
  <path d="M 104 20 C 104 29 98 35 89 35 C 98 35 104 41 104 50 C 104 41 110 35 119 35 C 110 35 104 29 104 20 Z" fill="#FFE873"/>
  <circle cx="104" cy="35" r="2" fill="#FFFFFF"/>
</svg>
